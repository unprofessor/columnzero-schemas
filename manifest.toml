[site]
base_url = "https://schemas.columnzero.com"

# Write a CNAME so Pages serves base_url. DNS for that host resolves and the
# custom domain is live, so this is on. Setting it false deletes the CNAME and
# tears the custom domain down, so it stays true while schemas.columnzero.com
# is the canonical host.
custom_domain = true

# Add one [[project]] block per upstream once its release workflow publishes a
# schemas.tar.gz meeting the index.json contract. Only this repository's own
# contract schema ships so far, and it is recorded in manifest.lock.
