[site]
base_url = "https://schemas.columnzero.com"

# Write a CNAME so Pages serves base_url. DNS for that host resolves and the
# custom domain is live, so this is on. Setting it false deletes the CNAME and
# tears the custom domain down, so it stays true while schemas.columnzero.com
# is the canonical host.
custom_domain = true

# Admission linters, chosen by published file suffix and run as
# `<argv...> <file> <canonical-url>`; exit 0 accepts. They run once, on the artifact
# being admitted, and never again -- a rule added here does not re-apply to bytes that
# are already published and can no longer be changed.
#
# A suffix with no linter publishes unchecked. That is the registry working as intended;
# `plan` reports it as `unlinted` rather than implying a pass.
[lint]
".schema.json" = ["python3", "lint/jsonschema_lint.py"]
