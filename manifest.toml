[site]
base_url = "https://schemas.columnzero.com"

# Write a CNAME so Pages serves base_url. Leave this false until DNS for that
# host resolves: publishing a CNAME switches Pages to the custom domain and
# takes the default *.github.io URL down with it, so a premature CNAME leaves
# nothing reachable to test against.
custom_domain = false

