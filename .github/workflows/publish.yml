name: Publish schemas

# Publishing is merge-triggered: a lock lands in the manifest tree and the release it
# names is reconciled onto gh-pages.  The schedule is an audit rather than a publish
# clock -- in steady state it fetches nothing, regenerates the derived resources over
# what is already there, and fails if the two trees have diverged.
on:
  push:
    branches: [main]
    paths:
      - "manifest/**"
      - "manifest.toml"
      - "src/**"
      - "lint/**"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

# Two runs reconciling at once would each snapshot a gh-pages that the other is about to
# change, and the loser would rebuild the derived resources without the winner's release.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          # The registry is pure standard library; the extra is the JSON Schema linter,
          # which runs as a separate process at admission time.
          python -m pip install '.[lint]'
          python -m unittest discover -s tests -v

      - name: Check out published tree or create it
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git -C "$PWD" worktree add ../published origin/gh-pages --detach
          else
            git worktree add --detach ../published
            git -C ../published switch --orphan gh-pages
            git -C ../published clean -fdx
          fi

      - name: Reconcile
        run: |
          mkdir -p site
          rsync -a --exclude=.git ../published/ site/
          python -m czschemas apply --site site

      - name: Refuse to change a published resource
        run: |
          # --exclude=.git is load-bearing: ../published is a worktree whose .git is a
          # file, and --delete would otherwise remove it and detach the checkout.
          rsync -a --delete --exclude=.git site/ ../published/
          git -C ../published add -A
          # git holds the only record of the published tree that the published tree
          # cannot edit, so immutability is enforced here rather than inside the build.
          git -C ../published diff --cached --name-status \
            | python -m czschemas verify --tree site

      - name: Publish changed aliases, indexes, and new releases
        run: |
          if git -C ../published diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git -C ../published config user.name "github-actions[bot]"
          git -C ../published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../published commit -m "Publish reconciled schemas"
          git -C ../published push origin HEAD:refs/heads/gh-pages
