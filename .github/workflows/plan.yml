name: Plan

# What a reviewer reads instead of the diff.  A lock names a project, a version, and a
# tag; nobody can verify a digest by looking at it, and the diff cannot show the part
# that actually reaches users -- which alias URLs are about to move.  This fetches the
# artifact, checks it against its pin, lints it, and renders the consequences.
#
# It writes nothing and needs no write permission: it is the job most exposed to
# untrusted input, since it downloads and unpacks an artifact the pull request names.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[lint]'
          python -m unittest discover -s tests -v

      - name: Refuse to edit or remove a lock
        run: |
          # The manifest tree is append-only for the same reason the publication tree is:
          # a lock that can be edited is a pin that can be moved after review.
          git diff --name-status "origin/${{ github.base_ref }}...HEAD" \
            | python -m czschemas verify --tree manifest

      - name: Check out the published tree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git -C "$PWD" worktree add ../published origin/gh-pages --detach
          else
            mkdir -p ../published
          fi

      - name: Plan
        run: |
          python -m czschemas plan --site ../published | tee plan.txt
          {
            echo '## Reconciliation plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
